name: KhoiOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install GRUB build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools
      - name: Test libk
        run: make test
      - name: Build GRUB Multiboot2 ISO
        run: make iso
